
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name senthur.tech www.senthur.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name senthur.tech www.senthur.tech;

    ssl_certificate /etc/letsencrypt/live/senthur.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senthur.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ------ Backend: Django API ------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ------ Backend: Token Auth ------
    location /api-auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------ Backend: Django Admin Control Panel ------
    location /sysadmin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------ Backend: Django Static Files ------
    location /static/ {
        alias /opt/finance/backend/finance_app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ------ Frontend: Next.js Catch-All (Pages, Images, CSS, everything) ------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Next.js specific headers for WebSockets and hot-reloading (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # ------ Security Logs ------
    access_log /var/log/nginx/finance_access.log;
    error_log  /var/log/nginx/finance_error.log;
}

